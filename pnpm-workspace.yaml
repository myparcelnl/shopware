# vue-demi picks the Vue 3 entry in its install script. The sass file watcher
# is not used: the build runs once.
allowBuilds:
  vue-demi: true
  '@parcel/watcher': false

autoDedupe: true

lockfile:
  includeResolutionSettings: true

# Our own packages, so a new release of them installs at once.
minimumReleaseAgeExclude:
  - '@myparcel/*'
  - '@myparcel-dev/*'
  - '@myparcel-eslint/*'
  - '@myparcel-pdk/*'
