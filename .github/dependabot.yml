version: 2
updates:
  - package-ecosystem: 'composer'
    directory: '/'
    schedule:
      interval: 'daily'
    commit-message:
      prefix: 'build'
      include: 'scope'
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 20
    cooldown:
      exclude:
        - 'myparcelnl/*'
    groups:
      minor-php-updates:
        applies-to: version-updates
        exclude-patterns:
          - "myparcelnl/pdk"
        update-types:
          - "minor"
          - "patch"
      php-pdk:
        patterns:
          - 'myparcelnl/pdk'
