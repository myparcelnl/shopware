name: 'Dismiss changes requested on re-request'

on:
  pull_request:
    types:
      - review_requested

concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.number }}'

jobs:
  dismiss-review:
    # A pull request from a fork gets a read-only token.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: write
    steps:
      # Test of myparcelnl/actions#179. Change the ref to v6 after its release.
      - uses: myparcelnl/actions/pr-dismiss-review@feat/INT-2371-pr-dismiss-review
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
